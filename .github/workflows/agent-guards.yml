# .github/workflows/agent-guards.yml
name: agent-guards
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Block changes to the checks
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'checks-change') }}
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(scripts/(guards|verify)\.sh|\.github/|\.claude/settings\.json|agent-team/evals/(cases/|[^/]*-rubric\.md)|agent-team/design/(DESIGN\.md|balance-targets\.json))'; then
            echo "This PR changes the checks. Add the checks-change label if you made this change."; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/guards.sh
      - run: bash scripts/verify.sh ci-${{ github.event.pull_request.number }}
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only for repos owned by an organization
      - name: Static analysis
        run: |
          pip install semgrep
          semgrep scan --config p/default --config p/owasp-top-ten --error --metrics=off
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependency audit
        run: |
          npm ci && npm audit --audit-level=high --omit=dev