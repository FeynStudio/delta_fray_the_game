# .github/workflows/agent-guards.yml
name: agent-guards
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Block changes to the checks
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'checks-change') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF"...HEAD \
            | grep -E '^(scripts/(guards|verify)\.sh|scripts/no-comments\.mjs|tests/no-comments\.test\.js|\.github/|\.claude/settings\.json|agent-team/evals/(cases/|[^/]*-rubric\.md)|agent-team/design/(DESIGN\.md|balance-targets\.json))'; then
            echo "This PR changes the checks. Add the checks-change label if you made this change."; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/guards.sh
      - run: bash scripts/verify.sh ci-${{ github.event.pull_request.number }}
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only for repos owned by an organization
      - name: Static analysis
        run: pipx run semgrep scan --config p/default --config p/owasp-top-ten --error --metrics=off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Dependency audit
        run: |
          npm ci && npm audit --audit-level=high --omit=dev
